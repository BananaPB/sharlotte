name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-review:
    # Skip draft PRs
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code PR Review
        uses: anthropics/claude-code-action@v1
        with:
          # Uses an OAuth token tied to your Claude subscription (see the
          # setup guide, "Configure the GitHub secret" step). If you switch
          # to an API key later, replace this with `anthropic_api_key`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # The prompt mirrors the "PR Reviewer Agent" role described in the
          # multi-agent workflow, with a pedagogical tone.
          prompt: |
            You are the PR Reviewer Agent for this Laravel 13 / React 19 +
            Inertia.js project. Use the repo's CLAUDE.md as your style and
            conventions reference — follow it strictly in your review.

            Analyze this pull request's diff and:

            1. Check security: CSRF, SQL injection, N+1 queries, authorization
               (Policies/Gates), input validation (FormRequests).
            2. Check compliance with the naming conventions and strict rules
               listed in CLAUDE.md (sections 3 and 4).
            3. For each point raised, explain the "why" in a pedagogical way —
               this project is maintained by a developer learning Laravel 13
               and React 19, so remarks should be educational, not merely
               corrective.
            4. Leave inline comments on specific points in the code (via the
               inline comment tool), and an overall summary as a PR comment
               listing: blocking issues, suggestions, and what's already done
               well.
            5. Do not modify any files or open any commits — this review is
               read-only, human control over the merge remains intact.

            Use `gh pr diff` and `gh pr view` to read the PR context, and post
            your summary with `gh pr comment`.

          claude_args: >-
            --allowed-tools
            "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

          track_progress: true
