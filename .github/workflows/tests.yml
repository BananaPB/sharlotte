name: tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Must match the DB_* values in phpunit.xml: `composer setup` runs `artisan migrate`
    # against these before `composer ci:check` runs the suite, so both need to agree on
    # the same Postgres database (see docs/decisions.md entry 5).
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        # TEMPORARY (reverted in the next commit): surface the failing output as an annotation,
        # because the job logs aren't readable from the session that opened this PR.
        run: |
          set -o pipefail
          if ! composer ci:check 2>&1 | tee /tmp/ci.out; then
            msg=$(grep -v '^\s*$' /tmp/ci.out | tail -n 120 | sed 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }')
            echo "::error title=ci-tail::${msg}"
            exit 1
          fi
